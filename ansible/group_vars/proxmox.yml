---
# Applied identically to all three (standalone, non-clustered) Proxmox hosts.

pve_firewall_enabled: true

# --check skips the community.proxmox tasks (no check-mode support); test on proxmox3 first.
pve_firewall_policy_in: "DROP"
pve_firewall_policy_out: "ACCEPT"

# pve_firewall_ipsets comes from provision-proxmox.nix via --extra-vars, not from here
# (Proxmox ipsets only accept IPs/CIDRs, not ranges).

# community.proxmox.proxmox_firewall rule format; pos = order, the DROP must stay last
# (the host chain doesn't inherit policy_in).
pve_firewall_rules:
  - pos: 0
    type: in
    action: ACCEPT
    macro: SSH
    source: "+management"
    comment: "SSH from compute/dynamic/fixed"
  - pos: 1
    type: in
    action: ACCEPT
    proto: tcp
    dport: "8006"
    source: "+management"
    comment: "Proxmox web UI from compute/dynamic/fixed"
  - pos: 2
    type: in
    action: ACCEPT
    macro: Ping
    source: "0.0.0.0/0"
    comment: "ICMP ping from anywhere (uptime monitoring)"
  - pos: 3
    type: in
    action: DROP
    comment: "Default deny"
