---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true

- name: Enable periodic apt updates
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Restrict unattended-upgrades to Debian security only
  ansible.builtin.copy:
    src: 51unattended-upgrades-homelab
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-homelab
    owner: root
    group: root
    mode: "0644"

- name: Enable unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades.service
    enabled: true
    state: started
    daemon_reload: true
