---
# Blanks/powers down the local tty1 console and grub's boot console to save
# power on headless-ish hosts; doesn't affect SSH/network access.

- name: Install console blank-on-timeout script
  ansible.builtin.copy:
    src: down_monitor.sh
    dest: /root/down_monitor.sh
    owner: root
    group: root
    mode: "0755"

- name: Run console blank-on-timeout script for the current console
  ansible.builtin.command: /root/down_monitor.sh
  changed_when: false

- name: Run console blank-on-timeout script on every boot
  ansible.builtin.cron:
    name: "console blank on timeout"
    special_time: reboot
    job: /root/down_monitor.sh

- name: Set consoleblank timeout in grub config
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet consoleblank=60"'
  notify: Update grub
