# Limits must fit log2ram's 128M /var/log RAM disk.
[Journal]
Storage=persistent
SplitMode=none
RateLimitIntervalSec=0
RateLimitBurst=0
ForwardToWall=yes
Seal=no
Compress=yes
SystemMaxUse=64M
RuntimeMaxUse=60M
MaxLevelStore=warning
MaxLevelSyslog=warning
MaxLevelKMsg=warning
MaxLevelConsole=notice
MaxLevelWall=crit
