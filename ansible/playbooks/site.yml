---
# Run via `nix run .#provision-proxmox`. Targets the Proxmox hosts only,
# never the lxcs/VMs running on them.
- name: Configure Proxmox hosts
  hosts: proxmox
  gather_facts: true

  # Explicit because the generated inventory lives outside this tree, so
  # Ansible's implicit group_vars auto-discovery can't find it.
  vars_files:
    - ../group_vars/proxmox.yml

  # Runs before every role's own tasks: a broken apt source here would fail
  # every apt: task in the play, not just pve_ssd_optimization's own. This
  # cleans up a legacy sources.list.d file from an earlier version of that
  # role (ansible.builtin.apt_repository) that conflicts with its current
  # deb822 .sources file over the Signed-By keyring path.
  pre_tasks:
    - name: Remove legacy log2ram apt source
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/azlux.list
        - /usr/share/keyrings/azlux-archive-keyring.gpg

  roles:
    - role: pve_ssh_hardening
      tags: [ssh-hardening]
    - role: pve_firewall
      tags: [firewall]
    - role: pve_vmid_range
      tags: [vmid-range]
    - role: pve_powertop
      tags: [powertop]
      # false just skips this role; it doesn't remove an already-installed service.
      when: pve_powertop_enabled | default(false)
    - role: pve_unattended_upgrades
      tags: [unattended-upgrades]
      when: pve_unattended_upgrades_enabled | default(false)
    - role: pve_ssd_optimization
      tags: [ssd-optimization]
      when: pve_ssd_optimization_enabled | default(false)
    - role: pve_console_powersave
      tags: [console-powersave]
      when: pve_console_powersave_enabled | default(false)
    - role: pve_cpu_governor
      tags: [cpu-governor]
      # Opt-out, not opt-in: defaults to true unless a host's provision flags say otherwise.
      when: pve_cpu_governor_enabled | default(true)
    - role: pve_pvestatd_autorestart
      tags: [pvestatd-autorestart]
      when: pve_pvestatd_autorestart_enabled | default(false)
    - role: pve_grafana_kiosk
      tags: [grafana-kiosk]
      when: pve_grafana_kiosk_enabled | default(false)
