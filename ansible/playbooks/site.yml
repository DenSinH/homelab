---
# Run via `nix run .#provision-proxmox`. Targets the Proxmox hosts only,
# never the lxcs/VMs running on them.
- name: Configure Proxmox hosts
  hosts: proxmox
  gather_facts: true

  # Explicit because the generated inventory lives outside this tree, so
  # Ansible's implicit group_vars auto-discovery can't find it.
  vars_files:
    - ../group_vars/proxmox.yml

  roles:
    - role: pve_firewall
      tags: [firewall]
    - role: pve_powertop
      tags: [powertop]
      # false just skips this role; it doesn't remove an already-installed service.
      when: pve_powertop_enabled | default(false)
    - role: pve_unattended_upgrades
      tags: [unattended-upgrades]
      when: pve_unattended_upgrades_enabled | default(false)
